<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Field Intelligence V2</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand"><div class="brandmark">G</div><div><b>Field Intelligence</b><span id="screenSubtitle">Command centre</span></div></div>
      <div class="top-actions">
        <span id="gpsBadge" class="status-badge muted">GPS off</span>
        <select id="repSelect" aria-label="Current rep"></select>
        <button id="refreshBtn" class="icon-btn" title="Refresh">↻</button>
      </div>
    </header>

    <main id="workspace">
      <section id="screen-home" class="screen"></section>
      <section id="screen-near" class="screen"></section>
      <section id="screen-plan" class="screen"></section>
      <section id="screen-log" class="screen"></section>
      <section id="screen-ask" class="screen"></section>
      <section id="screen-team" class="screen"></section>
      <section id="screen-property" class="screen"></section>
    </main>

    <nav class="bottom-nav" aria-label="Primary">
      <button data-screen="home"><span>⌂</span><small>Home</small></button>
      <button data-screen="near"><span>⌖</span><small>Near Me</small></button>
      <button data-screen="plan"><span>◈</span><small>Plan</small></button>
      <button data-screen="log" class="primary"><span>＋</span><small>Log</small></button>
      <button data-screen="ask"><span>✦</span><small>Ask</small></button>
      <button data-screen="team"><span>♟</span><small>Team</small></button>
    </nav>
  </div>

  <div id="toast" role="status"></div>
  <div id="modalRoot"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
